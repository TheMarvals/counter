<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contador Mecánico — Aprendiendo el Valor Posicional</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: #F0F4F8;
      color: #2D3748;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }
    .container {
      max-width: 900px;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    /* Barra Superior */
    .top-bar {
      background: #FFFFFF;
      border: 1px solid #D2D6DC;
      border-radius: 12px;
      padding: 10px 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.04);
    }
    .top-bar-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
    }
    .btn-group {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    button {
      font-family: inherit;
      font-weight: 700;
      font-size: 12px;
      border-radius: 6px;
      padding: 7px 14px;
      border: 1px solid #CBD5E0;
      background: #EDF2F7;
      color: #4A5568;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    button:hover {
      background: #E2E8F0;
    }
    button:active {
      transform: scale(0.97);
    }
    button.active {
      background: #165E7D;
      color: #FFFFFF;
      border-color: #0E4459;
    }
    .btn-dashed {
      background: #EBF8FF;
      color: #2B6CB0;
      border: 1px dashed #63B3ED;
    }
    .btn-dashed:hover {
      background: #BEE3F8;
    }
    .btn-yellow {
      background: #FEFCBF;
      color: #744210;
      border-color: #D69E2E;
    }
    .btn-yellow:hover {
      background: #FAF089;
    }
    .btn-red {
      background: #FED7D7;
      color: #9B2C2C;
      border-color: #FEB2B2;
    }
    .btn-red:hover {
      background: #FEB2B2;
    }

    /* Odómetro */
    .odometer-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 10px 0 0 0;
    }
    .counter-columns {
      display: flex;
      gap: 8px;
      align-items: center;
      position: relative;
    }
    .column-unit {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      transition: all 0.25s ease;
    }
    .column-unit.hidden {
      display: none;
    }

    /* Etiquetas de Encabezado */
    .header-tag {
      width: 82px;
      height: 52px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      font-weight: 900;
      border-radius: 4px;
      letter-spacing: -0.5px;
      transition: all 0.2s ease;
    }
    .header-tag.mil {
      background-color: #E35E28;
      border: 2px solid #8C320F;
      color: #0A0A0A;
    }
    .header-tag.simple {
      background-color: #FFFFFF;
      border: 2px solid #506E82;
      color: #0A0A0A;
    }
    .header-tag.pulse {
      transform: scale(1.08);
      filter: brightness(1.25);
    }

    /* Flechas Triangulares */
    .arrow-btn {
      width: 58px;
      height: 38px;
      background: none;
      border: none;
      padding: 0;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .arrow-btn svg {
      width: 100%;
      height: 100%;
      fill: #165E7D;
      filter: drop-shadow(0 2px 3px rgba(0,0,0,0.25));
      transition: fill 0.15s ease, transform 0.1s ease;
    }
    .arrow-btn:hover svg {
      fill: #2080AA;
    }
    .arrow-btn:active svg {
      fill: #0E4459;
      transform: scale(0.92);
    }

    /* Marco del Tambor */
    .drum-frame {
      background: #1A1A1C;
      border: 4px solid #7C828C;
      border-radius: 8px;
      padding: 8px 10px;
      display: flex;
      gap: 6px;
      align-items: center;
      position: relative;
      box-shadow: inset 0 0 12px rgba(0,0,0,0.8), 0 8px 24px rgba(0,0,0,0.3);
    }
    .wheel {
      width: 82px;
      height: 154px;
      background: linear-gradient(180deg, 
        #0A0A0C 0%, 
        #202226 14%, 
        #383C42 40%, 
        #4C5058 50%, 
        #383C42 60%, 
        #202226 86%, 
        #0A0A0C 100%
      );
      border-radius: 4px;
      overflow: hidden;
      position: relative;
      cursor: pointer;
      box-shadow: inset -3px 0 6px rgba(0,0,0,0.6), inset 3px 0 6px rgba(0,0,0,0.6);
    }
    .wheel::after {
      content: "";
      position: absolute;
      top: 50%;
      left: 3px;
      right: 3px;
      height: 1px;
      background: rgba(255,255,255,0.18);
      pointer-events: none;
    }
    .wheel-inner {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      transform: translateY(0);
      transition: transform 0.24s cubic-bezier(0.25, 1, 0.5, 1);
    }
    .wheel-digit {
      width: 100%;
      height: 154px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 64px;
      font-weight: 900;
      color: #F8F8FA;
      text-shadow: 0 3px 6px rgba(0,0,0,0.8);
    }

    /* Punto Separador de Miles */
    .thousands-dot {
      width: 6px;
      height: 6px;
      background-color: #E6E6EB;
      border-radius: 50%;
      position: absolute;
      top: calc(50% + 14px);
      box-shadow: 0 0 3px rgba(255,255,255,0.8);
      pointer-events: none;
      display: none;
    }

    /* Sombra de Piso */
    .floor-shadow {
      width: 75%;
      height: 32px;
      background: radial-gradient(ellipse at center, rgba(0,0,0,0.45) 0%, rgba(0,0,0,0) 70%);
      margin-top: 4px;
    }

    /* Panel de Descomposición */
    .breakdown-panel {
      background: #F8F9FA;
      border: 2px solid #E0E3E8;
      border-radius: 12px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .breakdown-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .breakdown-title {
      font-size: 16px;
      font-weight: 800;
      color: #2D3748;
    }
    .btn-speak {
      background: #165E7D;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 8px 18px;
      font-weight: 700;
      font-size: 13px;
    }
    .btn-speak:hover {
      background: #2080AA;
    }
    .words-box {
      background: #FFFFFF;
      border: 1px solid #CBD5E0;
      border-radius: 8px;
      padding: 12px 16px;
      font-size: 18px;
      font-weight: 600;
    }
    .chips-row {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .chip {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 8px 14px;
      border-radius: 8px;
    }
    .chip.mil {
      background: #FFE8D6;
      border: 2px solid #E35E28;
      color: #A83E12;
    }
    .chip.simple {
      background: #EBF4F6;
      border: 2px solid #165E7D;
      color: #165E7D;
    }
    .chip-pos {
      font-size: 11px;
      font-weight: 800;
    }
    .chip-val {
      font-size: 15px;
      font-weight: 800;
    }
    .plus-sign {
      font-size: 18px;
      font-weight: 900;
      color: #718096;
    }
    .banner {
      background: #FEFCBF;
      color: #744210;
      border: 1px solid #ECC94B;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 13px;
      font-weight: 600;
      transition: all 0.3s ease;
    }
    .banner.alert {
      background: #C6F6D5;
      color: #22543D;
      border-color: #38A169;
    }

    /* Panel de Retos */
    .challenge-panel {
      background: #FFFDF5;
      border: 2px solid #F6E05E;
      border-radius: 12px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .challenge-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .challenge-prompt {
      background: #FFFFFF;
      border: 2px dashed #CBD5E0;
      border-radius: 8px;
      padding: 12px 16px;
      font-size: 14px;
      font-weight: 700;
    }
    .challenge-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }
  </style>
</head>
<body>

<div class="container">

  <!-- Barra Superior -->
  <div class="top-bar">
    <div class="top-bar-row">
      <div class="btn-group">
        <span style="font-weight: 800; font-size: 13px; color: #4A5568;">Nivel:</span>
        <button id="lvl3" onclick="setLevel(3)">3 Dígitos</button>
        <button id="lvl4" onclick="setLevel(4)">4 Dígitos</button>
        <button id="lvl6" class="active" onclick="setLevel(6)">6 Dígitos</button>
        <button class="btn-dashed" onclick="addNextColumn()">+ Columna</button>
      </div>
      <button id="btnZeros" onclick="toggleZeros()">Ceros Izq: Ocultos</button>
    </div>
    <div class="top-bar-row">
      <div class="btn-group">
        <button class="btn-yellow" onclick="setRandom()">🎲 Número Sorpresa</button>
        <button class="btn-red" onclick="resetCounter()">🔄 Poner a 0</button>
      </div>
      <div class="btn-group">
        <button id="btnSound" onclick="toggleSound()">🔊 Sonido: ON</button>
        <button id="btnChallenges" onclick="toggleChallenges()">🎮 Retos: ON</button>
      </div>
    </div>
  </div>

  <!-- Odómetro Central -->
  <div class="odometer-wrapper">
    <div class="counter-columns">

      <!-- CM -->
      <div class="column-unit" id="col_5">
        <div class="header-tag mil" id="tag_5">CM</div>
        <button class="arrow-btn" onclick="stepColumn(5, 1)">
          <svg viewBox="0 0 24 16"><polygon points="12,0 0,16 24,16"/></svg>
        </button>
        <div class="drum-frame">
          <div class="wheel" id="wheel_5" onwheel="onWheelScroll(event, 5)">
            <div class="wheel-inner" id="inner_5"></div>
          </div>
        </div>
        <button class="arrow-btn" onclick="stepColumn(5, -1)">
          <svg viewBox="0 0 24 16"><polygon points="12,16 0,0 24,0"/></svg>
        </button>
      </div>

      <!-- DM -->
      <div class="column-unit" id="col_4">
        <div class="header-tag mil" id="tag_4">DM</div>
        <button class="arrow-btn" onclick="stepColumn(4, 1)">
          <svg viewBox="0 0 24 16"><polygon points="12,0 0,16 24,16"/></svg>
        </button>
        <div class="drum-frame">
          <div class="wheel" id="wheel_4" onwheel="onWheelScroll(event, 4)">
            <div class="wheel-inner" id="inner_4"></div>
          </div>
        </div>
        <button class="arrow-btn" onclick="stepColumn(4, -1)">
          <svg viewBox="0 0 24 16"><polygon points="12,16 0,0 24,0"/></svg>
        </button>
      </div>

      <!-- UM -->
      <div class="column-unit" id="col_3" style="position: relative;">
        <div class="header-tag mil" id="tag_3">UM</div>
        <button class="arrow-btn" onclick="stepColumn(3, 1)">
          <svg viewBox="0 0 24 16"><polygon points="12,0 0,16 24,16"/></svg>
        </button>
        <div class="drum-frame">
          <div class="wheel" id="wheel_3" onwheel="onWheelScroll(event, 3)">
            <div class="wheel-inner" id="inner_3"></div>
          </div>
          <!-- Punto de miles entre UM y C -->
          <div class="thousands-dot" id="thousandsDot"></div>
        </div>
        <button class="arrow-btn" onclick="stepColumn(3, -1)">
          <svg viewBox="0 0 24 16"><polygon points="12,16 0,0 24,0"/></svg>
        </button>
      </div>

      <!-- C -->
      <div class="column-unit" id="col_2">
        <div class="header-tag simple" id="tag_2">C</div>
        <button class="arrow-btn" onclick="stepColumn(2, 1)">
          <svg viewBox="0 0 24 16"><polygon points="12,0 0,16 24,16"/></svg>
        </button>
        <div class="drum-frame">
          <div class="wheel" id="wheel_2" onwheel="onWheelScroll(event, 2)">
            <div class="wheel-inner" id="inner_2"></div>
          </div>
        </div>
        <button class="arrow-btn" onclick="stepColumn(2, -1)">
          <svg viewBox="0 0 24 16"><polygon points="12,16 0,0 24,0"/></svg>
        </button>
      </div>

      <!-- D -->
      <div class="column-unit" id="col_1">
        <div class="header-tag simple" id="tag_1">D</div>
        <button class="arrow-btn" onclick="stepColumn(1, 1)">
          <svg viewBox="0 0 24 16"><polygon points="12,0 0,16 24,16"/></svg>
        </button>
        <div class="drum-frame">
          <div class="wheel" id="wheel_1" onwheel="onWheelScroll(event, 1)">
            <div class="wheel-inner" id="inner_1"></div>
          </div>
        </div>
        <button class="arrow-btn" onclick="stepColumn(1, -1)">
          <svg viewBox="0 0 24 16"><polygon points="12,16 0,0 24,0"/></svg>
        </button>
      </div>

      <!-- U -->
      <div class="column-unit" id="col_0">
        <div class="header-tag simple" id="tag_0">U</div>
        <button class="arrow-btn" onclick="stepColumn(0, 1)">
          <svg viewBox="0 0 24 16"><polygon points="12,0 0,16 24,16"/></svg>
        </button>
        <div class="drum-frame">
          <div class="wheel" id="wheel_0" onwheel="onWheelScroll(event, 0)">
            <div class="wheel-inner" id="inner_0"></div>
          </div>
        </div>
        <button class="arrow-btn" onclick="stepColumn(0, -1)">
          <svg viewBox="0 0 24 16"><polygon points="12,16 0,0 24,0"/></svg>
        </button>
      </div>

    </div>
    <div class="floor-shadow"></div>
  </div>

  <!-- Panel de Descomposición Aditiva y Palabras -->
  <div class="breakdown-panel">
    <div class="breakdown-header">
      <span class="breakdown-title">✨ Valor Posicional y Descomposición</span>
      <button class="btn-speak" onclick="speakCurrentNumber()">🔊 Escuchar cómo se lee</button>
    </div>
    <div class="words-box" id="wordsDisplay"></div>
    <div class="chips-row" id="chipsContainer"></div>
    <div class="banner" id="bannerMsg">¡Usa las flechas ▲ y ▼ para ver cómo cambian los valores!</div>
  </div>

  <!-- Panel de Retos -->
  <div class="challenge-panel" id="challengePanel">
    <div class="challenge-header">
      <span style="font-weight: 800; color: #744210;">🎮 Modo Desafíos Matemáticos</span>
      <span style="font-weight: 800; color: #D69E2E;" id="starsCount">⭐ 0 Estrellas</span>
    </div>
    <div class="challenge-prompt" id="challengePrompt">Pulsa 'Nuevo Desafío' para comenzar.</div>
    <div class="challenge-actions">
      <button style="background: #ED8936; color: white;" onclick="newChallenge()">🎲 Nuevo Desafío</button>
      <button style="background: #38A169; color: white;" onclick="checkChallenge()">✅ Comprobar</button>
      <span id="challengeFeedback" style="font-weight: 800; margin-left: 10px;"></span>
    </div>
  </div>

</div>

<script>
  // Estado del modelo
  let currentValue = 103245;
  let activeDigits = 6;
  let hideLeadingZeros = true;
  let soundEnabled = true;
  let stars = 0;
  let currentChallenge = null;

  const weights = [1, 10, 100, 1000, 10000, 100000];
  const colNames = ["U", "D", "C", "UM", "DM", "CM"];
  const colFullNames = ["Unidades", "Decenas", "Centenas", "Unidades de Mil", "Decenas de Mil", "Centenas de Mil"];
  const isMilFlags = [false, false, false, true, true, true];

  // Audio Context Web Audio para Clics Mecánicos sin archivos externos
  const AudioContext = window.AudioContext || window.webkitAudioContext;
  let audioCtx = null;

  function initAudio() {
    if (!audioCtx) {
      audioCtx = new AudioContext();
    }
  }

  function playClickSound() {
    if (!soundEnabled) return;
    try {
      initAudio();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = "triangle";
      osc.frequency.setValueAtTime(1400, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(300, audioCtx.currentTime + 0.04);
      gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.04);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.045);
    } catch(e) {}
  }

  function playChimeSound() {
    if (!soundEnabled) return;
    try {
      initAudio();
      [880, 1320, 1760].forEach((freq, i) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.15, audioCtx.currentTime + i*0.08);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + i*0.08 + 0.35);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(audioCtx.currentTime + i*0.08);
        osc.stop(audioCtx.currentTime + i*0.08 + 0.35);
      });
    } catch(e) {}
  }

  // Inicializar cilindros con dígitos 0..9 duplicados para giro infinito
  function initWheels() {
    for (let i = 0; i < 6; i++) {
      const inner = document.getElementById("inner_" + i);
      inner.innerHTML = "";
      // Crear 30 dígitos para permitir giro suave
      for (let cycle = 0; cycle < 3; cycle++) {
        for (let d = 0; d < 10; d++) {
          const div = document.createElement("div");
          div.className = "wheel-digit";
          div.textContent = d;
          inner.appendChild(div);
        }
      }
    }
  }

  function getDigit(idx) {
    return Math.floor(currentValue / weights[idx]) % 10;
  }

  function formatSpanishNumber(n) {
    return n.toLocaleString("es-ES");
  }

  // Conversión a palabras en español
  const UNIDADES = ["cero", "uno", "dos", "tres", "cuatro", "cinco", "seis", "siete", "ocho", "nueve"];
  const ESPECIALES_10 = ["diez", "once", "doce", "trece", "catorce", "quince", "dieciséis", "diecisiete", "dieciocho", "diecinueve"];
  const DECENAS = ["", "", "veinte", "treinta", "cuarenta", "cincuenta", "sesenta", "setenta", "ochenta", "noventa"];
  const VEINTES = ["veinte", "veintiuno", "veintidós", "veintitrés", "veinticuatro", "veinticinco", "veintiséis", "veintisiete", "veintiocho", "veintinueve"];
  const CENTENAS = ["", "ciento", "doscientos", "trescientos", "cuatrocientos", "quinientos", "seiscientos", "setecientos", "ochocientos", "novecientos"];

  function centenasAPalabras(n) {
    if (n === 0) return "";
    if (n === 100) return "cien";
    let p = [];
    let c = Math.floor(n / 100);
    let r = n % 100;
    if (c > 0) p.push(CENTENAS[c]);
    if (r === 0) return p.join(" ");
    if (r < 10) p.push(UNIDADES[r]);
    else if (r < 20) p.push(ESPECIALES_10[r - 10]);
    else if (r < 30) p.push(VEINTES[r - 20]);
    else {
      let d = Math.floor(r / 10);
      let u = r % 10;
      p.push(u === 0 ? DECENAS[d] : DECENAS[d] + " y " + UNIDADES[u]);
    }
    return p.join(" ");
  }

  function numeroAPalabras(n) {
    if (n === 0) return "Cero";
    let miles = Math.floor(n / 1000);
    let units = n % 1000;
    let p = [];
    if (miles > 0) {
      if (miles === 1) p.push("mil");
      else {
        let tm = centenasAPalabras(miles);
        if (tm.endsWith("veintiuno")) tm = tm.slice(0, -3) + "ún";
        else if (tm.endsWith(" uno")) tm = tm.slice(0, -4) + " un";
        p.push(tm + " mil");
      }
    }
    if (units > 0) p.push(centenasAPalabras(units));
    let res = p.join(" ");
    return res.charAt(0).toUpperCase() + res.slice(1);
  }

  // Actualizar UI
  let prevDigits = [0, 0, 0, 0, 0, 0];

  function updateUI(animated = true) {
    const maxVal = Math.pow(10, activeDigits) - 1;
    if (currentValue > maxVal) currentValue = maxVal;
    if (currentValue < 0) currentValue = 0;

    const currentDigits = [];
    for (let i = 0; i < 6; i++) {
      currentDigits[i] = getDigit(i);
    }

    // Visibilidad de columnas (Ocultación de ceros a la izquierda)
    let visibleCount = activeDigits;
    if (hideLeadingZeros) {
      visibleCount = currentValue === 0 ? 1 : String(currentValue).length;
      visibleCount = Math.min(activeDigits, Math.max(1, visibleCount));
    }

    for (let i = 0; i < 6; i++) {
      const col = document.getElementById("col_" + i);
      const isVisible = i < visibleCount;
      if (isVisible) {
        col.classList.remove("hidden");
      } else {
        col.classList.add("hidden");
      }

      // Animación EXCLUSIVA si el dígito cambió
      const inner = document.getElementById("inner_" + i);
      const digit = currentDigits[i];
      if (currentDigits[i] !== prevDigits[i] || !animated) {
        // Desplazamiento en el tambor: ciclo base 10 + dígito
        const targetY = -(10 + digit) * 154;
        inner.style.transform = `translateY(${targetY}px)`;
      }
    }
    prevDigits = [...currentDigits];

    // Punto de miles entre UM y C
    const dot = document.getElementById("thousandsDot");
    if (currentValue >= 1000 && visibleCount >= 4) {
      dot.style.display = "block";
      dot.style.right = "-6px";
    } else {
      dot.style.display = "none";
    }

    // Actualizar palabras y número con puntuación
    const formatted = formatSpanishNumber(currentValue);
    const words = numeroAPalabras(currentValue);
    document.getElementById("wordsDisplay").innerHTML = `<b>${formatted}</b>  —  « ${words} »`;

    // Descomposición Aditiva (sin spots con ceros a la izquierda ni ceros intermedios)
    const chipsContainer = document.getElementById("chipsContainer");
    chipsContainer.innerHTML = "";

    if (currentValue === 0) {
      chipsContainer.innerHTML = `
        <div class="chip simple">
          <span class="chip-pos">U</span>
          <span class="chip-val">0</span>
        </div>
      `;
    } else {
      let activeItems = [];
      for (let i = 5; i >= 0; i--) {
        if (i < visibleCount) {
          let d = currentDigits[i];
          let val = d * weights[i];
          if (val > 0) {
            activeItems.push({
              pos: colNames[i],
              val: formatSpanishNumber(val),
              isMil: isMilFlags[i]
            });
          }
        }
      }

      activeItems.forEach((item, index) => {
        const chip = document.createElement("div");
        chip.className = `chip ${item.isMil ? "mil" : "simple"}`;
        chip.innerHTML = `
          <span class="chip-pos">${item.pos}</span>
          <span class="chip-val">${item.val}</span>
        `;
        chipsContainer.appendChild(chip);

        if (index < activeItems.length - 1) {
          const plus = document.createElement("span");
          plus.className = "plus-sign";
          plus.textContent = "+";
          chipsContainer.appendChild(plus);
        }
      });
    }

    // Comprobar reto activo
    checkChallengeAuto();
  }

  function stepColumn(idx, dir) {
    playClickSound();
    pulseTag(idx);

    const oldDigit = getDigit(idx);
    let newVal = currentValue + dir * weights[idx];
    const maxVal = Math.pow(10, activeDigits) - 1;

    if (newVal > maxVal) newVal = newVal % (maxVal + 1);
    if (newVal < 0) newVal = maxVal - (Math.abs(newVal) - 1);

    // Mensaje de acarreo pedagógico
    if (dir > 0 && oldDigit === 9) {
      showBanner(`¡Genial! 10 ${colFullNames[idx]} se transforman en 1 ${colFullNames[Math.min(5, idx + 1)]}.`, true);
    } else if (dir < 0 && oldDigit === 0) {
      showBanner(`¡Desagrupación! Se toma 1 ${colFullNames[Math.min(5, idx + 1)]} para obtener 10 ${colFullNames[idx]}.`, true);
    }

    currentValue = newVal;
    updateUI(true);
  }

  function pulseTag(idx) {
    const tag = document.getElementById("tag_" + idx);
    if (tag) {
      tag.classList.add("pulse");
      setTimeout(() => tag.classList.remove("pulse"), 250);
    }
  }

  function showBanner(msg, isAlert = false) {
    const b = document.getElementById("bannerMsg");
    b.textContent = msg;
    if (isAlert) {
      b.classList.add("alert");
      setTimeout(() => b.classList.remove("alert"), 3500);
    }
  }

  function onWheelScroll(e, idx) {
    e.preventDefault();
    if (e.deltaY < 0) stepColumn(idx, 1);
    else if (e.deltaY > 0) stepColumn(idx, -1);
  }

  function addNextColumn() {
    playClickSound();
    let visibleCount = currentValue === 0 ? 1 : String(currentValue).length;
    if (visibleCount < activeDigits) {
      currentValue += weights[visibleCount];
      updateUI(true);
    }
  }

  function setLevel(lvl) {
    activeDigits = lvl;
    document.querySelectorAll(".btn-group button").forEach(b => {
      if (b.id === "lvl" + lvl) b.classList.add("active");
      else if (b.id && b.id.startsWith("lvl")) b.classList.remove("active");
    });
    updateUI(true);
  }

  function toggleZeros() {
    hideLeadingZeros = !hideLeadingZeros;
    document.getElementById("btnZeros").textContent = hideLeadingZeros ? "Ceros Izq: Ocultos" : "Ceros Izq: Visibles";
    updateUI(true);
  }

  function setRandom() {
    playClickSound();
    const maxVal = Math.pow(10, activeDigits) - 1;
    const minVal = activeDigits > 1 ? Math.pow(10, activeDigits - 1) : 0;
    currentValue = Math.floor(Math.random() * (maxVal - minVal + 1)) + minVal;
    updateUI(true);
  }

  function resetCounter() {
    playClickSound();
    currentValue = 0;
    updateUI(true);
  }

  function toggleSound() {
    soundEnabled = !soundEnabled;
    document.getElementById("btnSound").textContent = soundEnabled ? "🔊 Sonido: ON" : "🔇 Sonido: OFF";
  }

  function toggleChallenges() {
    const cp = document.getElementById("challengePanel");
    const vis = cp.style.display !== "none";
    cp.style.display = vis ? "none" : "flex";
    document.getElementById("btnChallenges").textContent = vis ? "🎮 Retos: OFF" : "🎮 Retos: ON";
  }

  // Síntesis de voz natural usando Web Speech API (Voz nativa de Siri en macOS!)
  function speakCurrentNumber() {
    if (!("speechSynthesis" in window)) return;
    window.speechSynthesis.cancel();
    const words = numeroAPalabras(currentValue);
    const utter = new SpeechSynthesisUtterance(words);
    utter.lang = "es-ES";
    utter.rate = 0.95;

    // Buscar la mejor voz natural en español
    const voices = window.speechSynthesis.getVoices();
    const naturalVoice = voices.find(v => (v.lang.startsWith("es") && (v.name.includes("Mónica") || v.name.includes("Paulina") || v.name.includes("Jorge") || v.name.includes("Google") || v.name.includes("Natural"))));
    if (naturalVoice) utter.voice = naturalVoice;

    window.speechSynthesis.speak(utter);
  }

  // Modo Retos
  function newChallenge() {
    const types = ["form", "digit", "add"];
    const type = types[Math.floor(Math.random() * types.length)];
    const maxVal = Math.pow(10, activeDigits) - 1;

    if (type === "form") {
      const target = Math.floor(Math.random() * maxVal) + 1;
      currentChallenge = {
        type: "target",
        value: target,
        text: `🎯 Misión: ¡Gira los cilindros hasta formar el número <b>${formatSpanishNumber(target)}</b>!`
      };
    } else if (type === "digit") {
      const idx = Math.floor(Math.random() * activeDigits);
      const targetDigit = Math.floor(Math.random() * 9) + 1;
      currentChallenge = {
        type: "digit",
        idx: idx,
        digit: targetDigit,
        text: `🎯 Misión: Haz que la cifra de las <b>${colFullNames[idx]} (${colNames[idx]})</b> sea igual a <b>${targetDigit}</b>.`
      };
    } else {
      const idx = Math.floor(Math.random() * Math.min(4, activeDigits));
      const amount = Math.floor(Math.random() * 3) + 1;
      const target = currentValue + amount * weights[idx];
      currentChallenge = {
        type: "target",
        value: target,
        text: `➕ Misión: Al número actual, ¡suma <b>${amount} ${colFullNames[idx].toLowerCase()}</b>!`
      };
    }

    document.getElementById("challengePrompt").innerHTML = currentChallenge.text;
    document.getElementById("challengeFeedback").textContent = "";
  }

  function checkChallengeAuto() {
    if (!currentChallenge) return;
    let solved = false;
    if (currentChallenge.type === "target" && currentValue === currentChallenge.value) solved = true;
    else if (currentChallenge.type === "digit" && getDigit(currentChallenge.idx) === currentChallenge.digit) solved = true;

    if (solved) {
      stars++;
      document.getElementById("starsCount").textContent = `⭐ ${stars} ${stars === 1 ? "Estrella" : "Estrellas"}`;
      const fb = document.getElementById("challengeFeedback");
      fb.textContent = "🎉 ¡EXCELENTE! ¡Completado!";
      fb.style.color = "#2F855A";
      playChimeSound();
      currentChallenge = null;
      setTimeout(newChallenge, 2200);
    }
  }

  function checkChallenge() {
    if (!currentChallenge) {
      newChallenge();
      return;
    }
    const fb = document.getElementById("challengeFeedback");
    fb.textContent = "Casi... ¡Sigue probando!";
    fb.style.color = "#C53030";
  }

  // Inicializar
  initWheels();
  updateUI(false);
  window.speechSynthesis.onvoiceschanged = () => {};
</script>
</body>
</html>
